name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: proxy_migration_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d proxy_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/proxy_migration_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run tests
        run: npm test
      - name: Verify Proxy database migration and RLS in disposable PostgreSQL
        run: bash scripts/test-proxy-rule-migration.sh
      - name: Check JavaScript syntax
        run: npm run check
      - name: Validate manifest JSON
        run: python -m json.tool manifest.json >/dev/null
      - name: Build and verify extension package
        run: npm run package:extension
      - name: Upload Edge test package
        uses: actions/upload-artifact@v4
        with:
          name: Alaxee-Proxy-Edge-Test-${{ github.sha }}
          path: dist/Alaxee-Proxy-v0.2.0.zip
          if-no-files-found: error
          retention-days: 14
